
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Usuario</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styleregistro.css">
    <script src="register.php" method="post" defer></script>
</head>
<body>

<header>
    <nav class="navbar">
        <ul>
            <li><a href="../principal/principal.html">Inicio</a></li>
            <li><a href="../curso/categorias.html">Cursos</a></li>
            <li><a href="#">Contacto</a></li>
        </ul>
        <div class="search-bar">
            <input type="text" placeholder="Buscar...">
        </div>
        <span class="profile-icon">👤</span>
    </nav>
</header>

<main>
    <div class="register-container">
        <h2>Registro de Usuario</h2>
        <form id="registerForm">
            <div class="form-group">
                <label for="full-name">Nombre Completo</label>
                <input type="text" id="full-name" name="full-name" placeholder="Ingresa tu nombre completo" required>
                <div class="error-message" id="nameError"></div>
            </div>
            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" name="email" placeholder="Ingresa tu correo electrónico" required>
                <div class="error-message" id="emailError"></div>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>
                <div class="error-message" id="passwordError"></div>
            </div>
            <div class="form-group">
                <label for="confirm-password">Confirmar Contraseña</label>
                <input type="password" id="confirm-password" name="confirm-password" placeholder="Confirma tu contraseña" required>
                <div class="error-message" id="confirmPasswordError"></div>
            </div>

            <div class="checkbox-container">
                <input type="checkbox" id="offers" name="offers">
                <label for="offers">Quiero recibir ofertas especiales, recomendaciones personalizadas y cursos de aprendizaje.</label>
            </div>

            <button type="submit" class="register-btn">Registrarse</button>

            <div class="terms">
                <p>Al registrarte, aceptas nuestras <a href="#">Condiciones de uso</a> y nuestra <a href="#">Política de privacidad</a>.</p>
            </div>
        </form>
    </div>
</main>

<footer>
<div class="social-icons">
    <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
    <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
    <a href="https://www.twitter.com" target="_blank"><i class="fab fa-x-twitter"></i></a>
</div>

    <div class="newsletter">
        <p>Suscríbete a nuestro boletín informativo:</p>
        <input type="email" placeholder="Correo electrónico">
        <button>Suscribirse</button>
    </div>
</footer>

</body>
</html>
