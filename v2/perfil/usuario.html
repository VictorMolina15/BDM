<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Academy</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-Zenh87qX5JnK2Jl0vWa8Ck2rdkQ2Bzep5IDxbcnCeuOxjzrPF/et3URy9Bv1WTRi" crossorigin="anonymous">
  <link href="usua.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
  <header>
    <nav class="navbar">
      <ul>
        <li><a href="../principal/principal.html">Inicio</a></li>
        <li><a href="../curso/categorias.html">Cursos</a></li>
        <li><a href="../curso/curso.html">Tus Cursos</a></li>
        <li><a href="#">Contacto</a></li>
      </ul>
      <div class="search-bar">
        <input type="text" placeholder="Buscar...">
      </div>
      <span class="profile-icon">👤</span>
    </nav>
  </header>

  <section class="Usuario">
    <div class="fondo-container">
      <div class="portada">

      </div>
      <div class="perfil">
        <img src="imagenes/user.png" alt="Foto de perfil">
      </div>

    </div>
    <div class="datos">
      <h3>Usuario</h3>
    </div>
    <div class="datos2">
      <label for="radio1" class="upload-btn"> Cursos</label>
      <input type="radio" id="radio1" name="radios" onchange="mostrarDiv('div1')">
      <label for="radio2" class="upload-btn2"> Informacion</label>
      <input type="radio" id="radio2" name="radios" onchange="mostrarDiv('div2')">


    </div>
    <div id="div1" class="Publicacion-muro">
      <div class="cur-container">
        <div class="left-column">
          <label for="radio4" class="upload-btn4">Cursos terminados</label>
          <input type="radio" id="radio4" name="radios" onchange="mostrarDiv3('')">
          <label for="radio5" class="upload-btn5">Cursos activos</label>
          <input type="radio" id="radio5" name="radios" onchange="mostrarDiv3('')">
          <label for="radio6" class="upload-btn5">Categoria</label>
          <input type="radio" id="radio6" name="radios" onchange="mostrarDiv3('')">
        </div>
      </div>

    </div>


    <div id="div2" class="Information-muro">
      <div class="user-container">
        <div class="left-column">
          <label for="radio7" class="upload-btn4">Información</label>
          <input type="radio" id="radio7" name="radios" onchange="mostrarDiv2('divi1')">
          <label for="radio8" class="upload-btn5">Editar</label>
          <input type="radio" id="radio8" name="radios" onchange="mostrarDiv2('divi2')">
          <label for="radio9" class="upload-btn5">Contraseña</label>
          <input type="radio" id="radio9" name="radios" onchange="mostrarDiv2('divi3')">
        </div>
        <div class="right-column">
          <div class="information" id="divi1">
            <h5 class="perf">Nombre</h5>
            <h5 class="perf">Apellidos</h5>
            <br>
            <h5 class="perf">fecha de nacimiento </h5>
            <h5 class="perf">email</h5>
            <h5 class="perf">Genero</h5>
            <br>
          </div>
          <div class="editar" id="divi2">
            <form action="">
              <div class="left-column-editar">
                <div class="profile-pic">
                  <div class="preview">
                    <img id="image-preview" src="#" alt="Vista previa de la imagen">
                  </div>
                  <input type="file" id="file" accept="image/*">
                  <label for="file" class="upload-btn">Agregar Foto</label>
                </div>
                <input type="text" placeholder="Usuario">
              </div>
              <div class="right-column-editar">
                <h5>Información</h5>
                <div class="general">
                  <input type="text" class="name" placeholder="Nombre">
                  <input type="text" class="lastname" placeholder="Apellidos">
                  <input type="date" class="date">
                  <input type="text" class="email" placeholder="Correo">
                  <input type="submit" value="Continuar">
                </div>
              </div>
            </form>

          </div>
          <div class="contraseña" id="divi3">
            <form action="">
              <h5>Actualizar contraseña</h5>
              <input type="text" placeholder="Contraseña actual">
              <br>
              <input type="text" placeholder="Nueva contraseña">
              <br>
              <input type="text" placeholder="Confirmar contraseña">
              <br>
              <input type="submit" value="Confirmar">
            </form>
          </div>

        </div>


      </div>
    </div>

  </section>

  <footer>
    <div class="social-icons">
      <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
      <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
      <a href="https://www.twitter.com" target="_blank"><i class="fab fa-x-twitter"></i></a>
    </div>

    <div class="newsletter">
      <p>Suscríbete a nuestro boletín informativo:</p>
      <input type="email" placeholder="Correo electrónico">
      <button>Suscribirse</button>
    </div>
  </footer>




  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
