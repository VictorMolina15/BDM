<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<header>

    <nav class="navbar">
        <ul>
            <li><a href="../principal/principal.html">Inicio</a></li>
            <li><a href="../curso/categorias.html">Cursos</a></li>
            <li><a href="../curso/curso.html">Tus Cursos</a></li>
            <li><a href="#">Pendientes</a></li>
        </ul>

        <div class="search-bar">
            <input type="text" placeholder="Buscar...">
        </div>

        <div class="profile-icon">
            <span class="profile-icon">👤</span>
        </div>
    </nav>

</header>

<body>

    <main>
        <div class="login-container">
            <h2>Inicio de Sesión</h2>
            <div id="error" class="error-message">Usuario o contraseña incorrectos</div>
            <form id="loginForm">
                <label for="username">Usuario:</label>
                <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required>

                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required>

                <button type="submit">Iniciar Sesión</button>
            </form>
        </div>
    </main>
</body>

<footer>
    <div class="social-icons">
        <a href="https://www.facebook.com" target="_blank"><i class="fab fa-facebook"></i></a>
        <a href="https://www.instagram.com" target="_blank"><i class="fab fa-instagram"></i></a>
        <a href="https://www.twitter.com" target="_blank"><i class="fab fa-x-twitter"></i></a>
    </div>

    <div class="newsletter">
        <p>Suscríbete a nuestro boletín informativo:</p>
        <form id="newsletterForm">
            <input type="email" id="email" name="email" placeholder="Tu correo electrónico" required>
            <button type="submit">Suscribirse</button>
        </form>
    </div>
</footer>

</html>
